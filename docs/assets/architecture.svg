<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .box-sub { font-size: 12.5px; fill: rgba(255,255,255,.9); }
      .step { font-size: 13px; font-weight: 600; fill: #334155; }
      .step-num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .mono { font-family: 'Consolas','Courier New',monospace; font-size: 12px; fill: #475569; }
      .band { font-size: 14px; font-weight: 700; fill: #0d9488; }
      .warn { font-size: 13px; font-weight: 600; fill: #64748b; }
    </style>
  </defs>

  <rect width="900" height="420" rx="16" fill="#f8fafc"/>

  <text x="450" y="42" text-anchor="middle" class="title">Uncloud — how your devices talk (LAN only)</text>

  <!-- Phone -->
  <g>
    <rect x="70" y="90" rx="18" ry="18" width="240" height="220" fill="url(#phone)"/>
    <rect x="82" y="102" rx="12" ry="12" width="216" height="196" fill="rgba(255,255,255,0.08)"/>
    <text x="190" y="135" text-anchor="middle" class="box-title">📱 Phone app</text>
    <text x="190" y="160" text-anchor="middle" class="box-sub">Flutter · Android / iOS</text>
    <text x="190" y="195" text-anchor="middle" class="box-sub">Gallery · timeline · map</text>
    <text x="190" y="218" text-anchor="middle" class="box-sub">EN / 中文 UI</text>
    <text x="190" y="252" text-anchor="middle" class="box-sub">camera roll auto-backup</text>
  </g>

  <!-- PC -->
  <g>
    <rect x="590" y="90" rx="18" ry="18" width="240" height="220" fill="url(#pc)"/>
    <rect x="602" y="102" rx="12" ry="12" width="216" height="196" fill="rgba(255,255,255,0.08)"/>
    <text x="710" y="135" text-anchor="middle" class="box-title">💻 PC / core engine</text>
    <text x="710" y="160" text-anchor="middle" class="box-sub">Node.js · zero-dependency</text>
    <text x="710" y="195" text-anchor="middle" class="box-sub">ed25519 device identity</text>
    <text x="710" y="218" text-anchor="middle" class="box-sub">JSON index on local disk</text>
    <text x="710" y="252" text-anchor="middle" class="box-sub">Windows · macOS · Linux</text>
  </g>

  <!-- Step 1: discovery -->
  <g>
    <circle cx="450" cy="130" r="13" fill="#0d9488"/>
    <text x="450" y="134.5" text-anchor="middle" class="step-num">1</text>
    <line x1="312" y1="130" x2="588" y2="130" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="450" y="118" text-anchor="middle" class="step">Discovery — UDP multicast</text>
    <text x="450" y="152" text-anchor="middle" class="mono">239.255.77.77:47777 · announce every 2 s</text>
  </g>

  <!-- Step 2: pairing -->
  <g>
    <circle cx="450" cy="200" r="13" fill="#6366f1"/>
    <text x="450" y="204.5" text-anchor="middle" class="step-num">2</text>
    <line x1="588" y1="200" x2="312" y2="200" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="450" y="188" text-anchor="middle" class="step">QR pairing — one scan to trust</text>
    <text x="450" y="222" text-anchor="middle" class="mono">uncloud:// + base64url { v, deviceId, name, pub }</text>
  </g>

  <!-- Step 3: transfer -->
  <g>
    <circle cx="450" cy="270" r="13" fill="#0f766e"/>
    <text x="450" y="274.5" text-anchor="middle" class="step-num">3</text>
    <line x1="312" y1="270" x2="588" y2="270" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="450" y="258" text-anchor="middle" class="step">Direct TCP transfer — wire speed</text>
    <text x="450" y="292" text-anchor="middle" class="mono">{ name, size, sha256 } + 64 KB chunks → { ok:true }</text>
  </g>

  <!-- LAN band -->
  <rect x="150" y="335" width="600" height="40" rx="20" fill="#ccfbf1"/>
  <text x="450" y="360" text-anchor="middle" class="band">🔒 Your LAN / Wi-Fi only — no internet · no cloud · no relay</text>

  <!-- bottom note -->
  <text x="450" y="400" text-anchor="middle" class="warn">ed25519 identity today · X25519 + ChaCha20-Poly1305 wire encryption in v0.2</text>
</svg>
