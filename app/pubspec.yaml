name: uncloud
description: >-
  Uncloud — a local-first photo & file manager that syncs between phone and PC
  over LAN. No cloud. No account. No server.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.7
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  file_picker: ^13.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.6
  intl: ">=0.20.3 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
